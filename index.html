:root{--navy:#0e287f;--lime:#dedf2b;--ivory:#ede8d5;--bg:#0e287f;--card:#ffffff;--fg:#111a44;--muted:#4a5275;--line:#d9d4c0;--err:#c13617;--field:#f4f3ee;
  --display:Poppins,"Segoe UI",system-ui,sans-serif;--text:Figtree,"Segoe UI",system-ui,sans-serif;--ease-out:cubic-bezier(.23,1,.32,1);color-scheme:light}

  body{background-image:radial-gradient(circle at 85% 12%,rgb(169 215 243/.10) 0 120px,transparent 121px),radial-gradient(circle at 10% 95%,rgb(169 215 243/.08) 0 160px,transparent 161px)}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--text);display:grid;place-items:center;
  padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  background-image:radial-gradient(circle at 85% 12%,rgb(222 223 43/.16) 0 120px,transparent 121px),radial-gradient(circle at 10% 95%,rgb(169 215 243/.12) 0 160px,transparent 161px)}
main{width:100%;max-width:420px;background:var(--card);border-radius:20px;padding:32px 28px 26px;box-shadow:0 24px 60px rgb(0 0 0/.28);
  animation:in .5s var(--ease-out) both}
@keyframes in{from{opacity:0;transform:translateY(12px) scale(.98)}}
@media (prefers-reduced-motion:reduce){main{animation:none}}
.logo{height:40px;width:auto;display:block;color:var(--fg);margin-bottom:24px}
h1{font:700 1.375rem/1.25 var(--display);margin:0 0 6px;text-wrap:balance}
p{margin:0}
.lead{color:var(--muted);margin-bottom:22px}
label.lbl{display:block;font-weight:600;font-size:.9375rem;margin-bottom:6px}
.field{display:flex;align-items:center;background:var(--field);border:1.5px solid var(--line);border-radius:12px;transition:border-color .15s ease}
.field:focus-within{border-color:var(--fg)}
.field.bad{border-color:var(--err)}
input[type=password],input[type=text]{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:500 1.0625rem var(--text);padding:13px 14px;outline:none;letter-spacing:.01em}
.show{border:0;background:transparent;color:var(--muted);font:600 .875rem var(--text);padding:0 14px;min-height:44px;cursor:pointer}
.show:focus-visible,.go:focus-visible,.chk input:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:8px}
.chk{display:flex;align-items:center;gap:10px;margin:14px 0 20px;font-size:.9375rem;color:var(--muted);cursor:pointer;min-height:32px}
.chk input{width:20px;height:20px;accent-color:var(--navy);margin:0}
.go{width:100%;min-height:50px;border:0;border-radius:999px;background:var(--lime);color:var(--navy);font:700 1.0625rem var(--display);cursor:pointer;
  transition:transform .12s var(--ease-out),filter .15s ease}
.go:active{transform:scale(.98)}
.go[disabled]{filter:saturate(.4) opacity(.75);cursor:progress}
.err{color:var(--err);font-weight:600;font-size:.9375rem;margin-top:10px;min-height:1.4em}
.foot{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:.8125rem;color:var(--muted)}
.foot p+p{margin-top:4px}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .32s ease}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
</style>

<script>
(() => {
  const P = JSON.parse(document.getElementById("payload").textContent), KEY = "hande.demo.key";
  const $ = id => document.getElementById(id), unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const salt = unb64(P.salt), iv = unb64(P.iv), ct = unb64(P.ct);
  const store = { get(){ try { return localStorage.getItem(KEY); } catch { return null; } }, set(v){ try { localStorage.setItem(KEY, v); } catch {} }, del(){ try { localStorage.removeItem(KEY); } catch {} } };

  async function derive(code){ const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name:"PBKDF2", hash:"SHA-256", salt, iterations:P.iter }, base, { name:"AES-GCM", length:256 }, true, ["decrypt"]); }
  async function open(key){
    const gz = await crypto.subtle.decrypt({ name:"AES-GCM", iv }, key, ct);
    const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    return html; }
  function show(html){ document.open(); document.write(html); document.close(); }

  // A remembered key is tied to this build's salt: a new code (new salt) simply asks again.
  const saved = store.get();
  if (saved) { try { const o = JSON.parse(saved); if (o.salt === P.salt) {
      crypto.subtle.importKey("raw", unb64(o.k), "AES-GCM", false, ["decrypt"]).then(open).then(show).catch(() => store.del()); } else store.del(); } catch { store.del(); } }

  $("show").addEventListener("click", e => { const i = $("code"), on = i.type === "password"; i.type = on ? "text" : "password"; e.currentTarget.textContent = on ? "Ocultar" : "Mostrar"; e.currentTarget.setAttribute("aria-pressed", on); });
  $("code").addEventListener("input", () => { $("fld").classList.remove("bad"); $("err").textContent = ""; });
  $("f").addEventListener("submit", async e => { e.preventDefault();
    const code = $("code").value.trim(), go = $("go");
    if (!code) { $("err").textContent = "Escribe el código de acceso."; $("code").focus(); return; }
    go.disabled = true; go.textContent = "Abriendo…";
    try {
      const key = await derive(code), html = await open(key);
      if ($("remember").checked) { const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key)); store.set(JSON.stringify({ salt:P.salt, k:btoa(String.fromCharCode(...raw)) })); }
      show(html);
    } catch {
      go.disabled = false; go.textContent = "Abrir prototipo";
      $("fld").classList.add("bad"); $("err").textContent = "Código incorrecto. Revisa letras, guiones y números.";
